<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>秘火守城 · Emberkeep</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060c15;color:#ece1ca;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;user-select:none;-webkit-user-select:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1320}article{text-align:center;width:330px}h1{font-weight:500;font-size:36px;letter-spacing:5px;margin-bottom:12px}small{letter-spacing:6px;color:#dfb96c;font-size:12px}p{font-size:14px;color:#8496a6;margin-top:38px}progress{appearance:none;width:100%;height:3px;border:0;background:#27303b}progress::-webkit-progress-bar{background:#27303b}progress::-webkit-progress-value{background:#dfb96c}button{background:#654a27;color:#ece1ca;border:1px solid #b58c48;padding:12px 36px;border-radius:6px;cursor:pointer}#retry{display:none}
</style><link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
</head><body><canvas id="canvas" tabindex="0"></canvas><div id="loading"><article><small>EMBERKEEP</small><h1>秘火守城</h1><progress id="progress"></progress><p id="status">正在唤醒地穴……</p><button id="retry" onclick="location.reload()">重新加载</button></article></div>
<script src="index.js"></script><script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11187368,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const statusText=document.getElementById('status'), bar=document.getElementById('progress');
engine.startGame({onProgress(current,total){if(total>0){bar.max=total;bar.value=current;statusText.textContent='载入地穴 '+Math.round(current/total*100)+'%'}else{bar.removeAttribute('value');statusText.textContent='正在准备符文与元素……'}}}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus()}).catch(error=>{statusText.textContent='加载失败：'+error.message;document.getElementById('retry').style.display='inline-block'});
</script></body></html>
